plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.5'
    id 'idea'
    id 'io.github.gradle-nexus.publish-plugin' version "2.0.0"
}

group = "net.woaf.jono.envoy"

// The Envoy release to build, e.g. -PenvoyVersion=1.40.0. -PbuildNumber=1 publishes a rebuild as 1.40.0-1.
def envoyVersion = providers.gradleProperty("envoyVersion").orNull
if (!envoyVersion) {
    throw new GradleException("Say which Envoy release to build, e.g. -PenvoyVersion=1.40.0")
}
def buildNumber = providers.gradleProperty("buildNumber").getOrNull()
version = buildNumber ? "${envoyVersion}-${buildNumber}" : envoyVersion

ext.projectScmUrl = "https://github.com/JonathanO/envoy-api-java"
ext.projectScmConnection = "scm:git:git://github.com/JonathanO/envoy-api-java.git"

repositories {
    mavenCentral()
}

idea.project {
    vcs = 'Git'
    languageLevel = JavaVersion.VERSION_11
    targetBytecodeVersion = JavaVersion.VERSION_11
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Apache 2.0 section 4: what we distribute carries the licence and the upstream NOTICEs.
    metaInf {
        from(rootProject.file("LICENSE"), rootProject.file("NOTICE"))
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

def grpcVersion = '1.79.0'
// Generated code runs on this protobuf-java major and the next, so 3.x gencode suits both 3.x and 4.x users.
def protobufVersion = '3.25.9'

dependencies {
    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    // Also provides google/api/{annotations,http}.proto and google/rpc/status.proto, which we therefore don't bundle.
    api "io.grpc:grpc-protobuf:${grpcVersion}"
    api "io.grpc:grpc-stub:${grpcVersion}"
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    runtimeOnly "io.grpc:grpc-netty-shaded:${grpcVersion}"
}

// Envoy pushes every release to the Buf registry, with its third-party proto dependencies pinned in api/buf.lock.
// Exporting a release label gives exactly the protos that release needs.
def exportedProtos = layout.buildDirectory.dir("envoy-protos")
def exportProtos = tasks.register("exportProtos", Exec) {
    inputs.property("envoyVersion", envoyVersion)
    outputs.dir(exportedProtos)
    def out = exportedProtos.get().asFile
    doFirst { delete out }
    commandLine "buf", "export", "buf.build/envoyproxy/envoy:v${envoyVersion}", "--output", out
    doLast {
        delete fileTree(out) {
            include "bazel/**" // Envoy's Bazel test data
            include "google/api/annotations.proto", "google/api/http.proto", "google/rpc/status.proto" // from proto-google-common-protos
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir exportedProtos
        }
    }
}

tasks.named("extractProto") { dependsOn exportProtos }
tasks.named("processResources") { dependsOn exportProtos }

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

jar {
    manifest {
        attributes(
                "Implementation-Title": "envoy-api",
                "Implementation-Version": archiveVersion
        )
    }
}

apply plugin: "maven-publish"
apply plugin: "signing"

nexusPublishing {
    repositories {
        sonatype {
            // Maven Central Portal's OSSRH-compatible staging API
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
            username = System.getenv("SONATYPE_USER")
            password = System.getenv("SONATYPE_PASSWORD")
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "envoy-api"

            pom {
                name = "envoy-api"
                description = "Java protobuf and gRPC classes for the Envoy xDS API, built from Envoy release ${envoyVersion}"
                url = projectScmUrl
                packaging = "jar"
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'JonathanO'
                        name = 'Jonathan Oddy'
                        email = "jonathan@woaf.net"
                    }
                }
                scm {
                    connection = projectScmConnection
                    developerConnection = projectScmConnection
                    url = projectScmUrl
                }
            }
        }
    }
}

if (System.getenv("OSS_SIGNING_KEY")) {
    signing {
        useInMemoryPgpKeys(System.getenv("OSS_SIGNING_KEY"), System.getenv("OSS_SIGNING_PASSWORD"))
        sign publishing.publications.mavenJava
    }
}
