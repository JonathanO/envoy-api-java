name: "Build"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: gradle/actions/setup-gradle@v6
      - name: "Build the latest Envoy release and publish locally"
        run: ./gradlew build publishToMavenLocal -PenvoyVersion="$(.github/scripts/envoy-releases.sh | tail -1)" --console=plain
